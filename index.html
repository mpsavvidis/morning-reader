<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Πρωινή ανάγνωση</title>
    
    <!-- Δηλώνουμε την εφαρμογή ως PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F9F4EB">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e293b'><path d='M20 3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h8v2zm3-4H7v-2h11v2zm0-4H7V7h11v2z'/></svg>">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e293b'><path d='M20 3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h8v2zm3-4H7v-2h11v2zm0-4H7V7h11v2z'/></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F9F4EB] text-slate-800 font-sans antialiased p-4 sm:p-6 md:p-8 min-h-screen selection:bg-amber-100 selection:text-amber-900">

    <div class="max-w-2xl mx-auto">
        <header class="mb-10 flex items-center justify-between border-b border-slate-300/50 pb-5 pt-4">
            <div class="flex items-center gap-4">
                <div class="bg-amber-50 p-2.5 rounded-xl border border-amber-200/60 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-amber-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9.5a2.5 2.5 0 00-2.5-2.5H15M9 11h3m-3 4h3m-3-4V7m0 8v-4" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-slate-900">Πρωινή ανάγνωση</h1>
                    <p class="text-[13px] text-slate-600 font-medium mt-0.5" id="last-updated">Ενημέρωση: --</p>
                </div>
            </div>
        </header>

        <main id="articles-container" class="space-y-6">
            <div id="loader" class="text-center py-10 animate-pulse">
                <p class="text-sm font-medium text-slate-500">Αναζήτηση σημερινών άρθρων...</p>
            </div>
        </main>
        
        <footer class="mt-16 pb-8 text-center">
            <p class="text-xs font-medium text-slate-500 mb-2">Daily Reader App &middot; Ανανεώνεται αυτόματα 06:30 π.μ.</p>
            <p class="text-[11px] font-bold text-slate-400/80 uppercase tracking-widest">&copy; Michail P. Savvidis</p>
        </footer>
    </div>

    <script src="app.js"></script>
    
    <!-- Ενεργοποίηση του Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker εγγράφηκε επιτυχώς.');
                    })
                    .catch(err => {
                        console.log('Αποτυχία εγγραφής ServiceWorker: ', err);
                    });
            });
        }
    </script>
</body>
</html>
